[package]
name = "easy_store"      
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A simple flash storage format for embedded systems"
repository = "https://github.com/orztrickster/easy_store"

[[bin]]
name = "easy_store"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c3", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3"] }
esp-println = { version = "0.12", features = ["esp32c3"] }
esp-alloc = "0.9.0"
embassy-executor = { version = "0.9.1", features = [] }
embassy-time = "0.5.0"

embedded-storage = "0.3.0"
esp-storage = { version = "0.5", features = ["esp32c3"] }

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[store]
name = "store"
path = "src/store.rs"