[package]
edition      = "2024"
name         = "esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }

esp-println = { version = "0.12", features = ["esp32"] }
esp-alloc = "0.10.0"
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32"] }
embassy-executor = "0.9.1"
embassy-time = "0.5.0"

easy_store = { path = "../..", features = ["esp32"] }
critical-section = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[profile.dev.package.esp-storage]
opt-level = 3